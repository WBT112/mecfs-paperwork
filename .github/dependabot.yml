version: 2

multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Berlin"
    target-branch: "staging"
    open-pull-requests-limit: 1
    labels:
      - "type:dependencies"

updates:
  # Bundle both npm manifests and Actions into one scheduled version-update PR.
  # Security updates remain event-driven and outside this version-update group.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/app"
    patterns:
      - "*"
    multi-ecosystem-group: "monthly-dependencies"
    rebase-strategy: "auto"
    # Routine patch-only updates stay out of the PR queue. This only limits
    # version updates; Dependabot security updates remain eligible immediately.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    # Avoid very fresh feature releases and give majors a longer maturation period.
    cooldown:
      default-days: 14
      semver-major-days: 90
      semver-minor-days: 14
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "monthly-dependencies"
    rebase-strategy: "auto"
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    cooldown:
      # GitHub Actions supports only one cooldown, not per-SemVer periods.
      default-days: 14
