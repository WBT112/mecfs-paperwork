name: npm Health

on:
  pull_request:
    paths:
      - "app/package.json"
      - "app/package-lock.json"
      - "tools/npm-health.mjs"
      - ".github/workflows/npm-health.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies (capture warnings)
        working-directory: app
        run: |
          set -euo pipefail
          npm ci --prefer-offline --fund=false --loglevel=warn 2>&1 | tee npm-install.log

      - name: Capture npm audit
        working-directory: app
        run: npm audit --json > npm-audit.json || true

      - name: Generate npm health summary
        env:
          NPM_WARNINGS_BUDGET: 6
        run: node tools/npm-health.mjs --install-log app/npm-install.log --audit-json app/npm-audit.json --output-dir app/npm-health

      - name: Publish npm health summary
        run: cat app/npm-health/npm-health-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload npm health artifacts (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-health
          path: |
            app/npm-install.log
            app/npm-audit.json
            app/npm-health/npm-warnings.json
            app/npm-health/npm-warnings.md
            app/npm-health/npm-audit-summary.md
            app/npm-health/npm-health-summary.md
          retention-days: 7
