name: SonarCloud (main scheduled)

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # Sonar empfiehlt vollständige Historie für relevanteres Reporting
          fetch-depth: 0
        # fetch-depth Empfehlung in Sonar Doku/Beispielen für GitHub Actions
        # (siehe SonarQube Cloud GitHub Actions Doku)
        # Quelle: Sonar Docs
        # (Cite below)

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies (app)
        working-directory: app
        env:
          HUSKY: "0"
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Unit tests + coverage (lcov)
        working-directory: app
        env:
          COVERAGE_GLOBAL_THRESHOLD_MODE: soft
        run: |
          npm run test:coverage -- \
            --coverage.reporter=lcov \
            --coverage.reporter=text \
            --coverage.reporter=json \
            --coverage.reporter=html

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
