name: Publish GitHub Release

on:
  workflow_run:
    workflows: [QA Gates]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish newly added release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_files < <(git diff --diff-filter=A --name-only "$RELEASE_COMMIT^1" "$RELEASE_COMMIT" -- 'docs/releases/*.md')
          for notes in "${release_files[@]}"; do
            release_tag="$(basename "$notes" .md)"
            [[ "$release_tag" =~ ^v\.?[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version="${release_tag#v}"
            version="${version#.}"
            [[ "$(jq -r '.version' app/package.json)" == "$version" ]]
            title="$(sed -n '1s/^# //p' "$notes")"
            [[ -n "$title" ]]
            if existing_commit="$(git rev-parse --verify --quiet "$release_tag^{commit}")"; then
              [[ "$existing_commit" == "$RELEASE_COMMIT" ]]
            fi
            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $release_tag already exists; leaving it unchanged."
              continue
            fi
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "$title" \
              --notes-file "$notes" \
              --latest
          done
