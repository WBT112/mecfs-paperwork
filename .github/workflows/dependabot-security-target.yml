name: Route Dependabot security updates to staging

on:
  workflow_run:
    workflows: [Dependabot target routing signal]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  retarget:
    name: Retarget to staging
    if: >-
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      TARGET_BRANCH: staging
    steps:
      - name: Verify Dependabot pull request
        id: verify
        run: |
          set -euo pipefail
          pr="$(gh api \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"

          author="$(jq -r '.user.login' <<<"$pr")"
          state="$(jq -r '.state' <<<"$pr")"
          base="$(jq -r '.base.ref' <<<"$pr")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"

          if [ "$author" != "dependabot[bot]" ] || \
             [ "$state" != "open" ] || \
             [ "$base" != "main" ] || \
             [ "$head_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "route=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "route=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<<"$pr")" >> "$GITHUB_OUTPUT"

      - name: Change pull request base
        if: steps.verify.outputs.route == 'true'
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --field "base=${TARGET_BRANCH}" \
            --silent

      - name: Update branch from staging when possible
        if: steps.verify.outputs.route == 'true'
        env:
          PR_HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
        run: |
          set -euo pipefail
          if ! response="$(gh api \
            --method PUT \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
            --field "expected_head_sha=${PR_HEAD_SHA}" 2>&1)"; then
            echo "::warning title=Manual update required::The pull request now targets ${TARGET_BRANCH}, but GitHub could not update its branch automatically: ${response}"
          fi
